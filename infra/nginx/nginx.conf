# NenuAIKadu reverse proxy for the production compose stack.
# Terminates TLS and routes /api → backend, everything else → frontend.

upstream backend_upstream {
    server backend:8000;
}

upstream frontend_upstream {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    # Redirect to HTTPS when certs are present. Out of the box serve http.
    # location /.well-known/acme-challenge/ { root /etc/nginx/certs; }
    # return 301 https://$host$request_uri;

    client_max_body_size 25m;

    # --- Backend API ---
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Backend docs / openapi ---
    location ~ ^/(docs|redoc|openapi.json)$ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
    }

    # --- WebSockets (realtime voice / call streams) ---
    location /ws/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Webhooks ---
    location /webhooks/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # --- Frontend (Next.js) ---
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}