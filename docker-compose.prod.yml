version: "3.9"

# Production-oriented compose for a single-host deploy.
# Portable to AWS later: frontend→Vercel, backend+worker→ECS, DB→RDS, Redis→ElastiCache, storage→S3.
# For MVP: run Postgres/Redis managed externally; this file assumes managed services via env.

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    restart: always

  frontend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${FRONTEND_URL:-http://localhost:8000/api/v1}
    environment:
      NEXT_PUBLIC_API_URL: ${FRONTEND_URL:-http://localhost:8000/api/v1}
    expose:
      - "3000"
    restart: always

  backend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    env_file: .env.production
    expose:
      - "8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    restart: always

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    env_file: .env.production
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info --concurrency=8
    restart: always